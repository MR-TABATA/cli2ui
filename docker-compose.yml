services:
  app:
    # The published image by default, so the first run is a pull rather than a
    # multi-minute apt/pip build on a laptop that has no reason to compile
    # anything. To build from your working tree instead, copy
    # docker-compose.override.yml.example — Compose merges it and its `build:`
    # wins. Pin a version with CLI2UI_IMAGE (e.g. jiniie/cli2ui:1.3.0).
    image: ${CLI2UI_IMAGE:-jiniie/cli2ui:latest}
    ports:
      - "8000:8000"
    environment:
      # Saved connections and auto-backups live in one SQLite file. Without the
      # source tree mounted it would sit inside the container and disappear the
      # next time the container is recreated, so put it on a named volume.
      CLI2UI_DB_PATH: /data/db.sqlite3
    volumes:
      - cli2ui-data:/data
    # Lets you reach a database running elsewhere on the host (another container
    # that publishes a port, or a native install) by connecting cli2ui to
    # host.docker.internal. Docker Desktop (Mac/Windows) provides this name
    # automatically; host-gateway adds it on Linux too, so the connect steps in
    # the README are the same on every platform.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sampledb:
        condition: service_healthy

  # Bundled sample database so the app has something to show on first run.
  # Connect to it with host=sampledb, db=shop, user=demo, password=demo
  # (these are the pre-filled defaults on the connection form).
  sampledb:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    volumes:
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # exposed on 5433 to avoid clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Optional, bigger demo database: the Postgres Pro "Airlines" dataset
  # (bookings/flights, ~250MB restored, jsonb columns and real data volume —
  # good for exercising features the tiny shop db can't, like the jsonb shape
  # viewer). Opt-in because the dump must be downloaded first:
  #
  #   seed/demo/fetch.sh                           # ~60MB download
  #   docker compose --profile demo up -d airlines # first boot loads for a few minutes
  #
  # Connect with host=airlines (or localhost:5434 from the host), db=demo,
  # user=demo, password=demo. The loaded data lives in a named volume, so the
  # multi-minute load happens once, not on every `up`.
  airlines:
    image: postgres:16
    profiles: ["demo"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - ./seed/demo/load-demo.sh:/docker-entrypoint-initdb.d/10-load-demo.sh:ro
      - ./seed/demo:/seed:ro
      - airlines-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # 5433 is taken by sampledb
    healthcheck:
      # -h localhost forces TCP: the temporary server that runs while the init
      # scripts load the dump listens on the unix socket only, so a socket
      # check would report healthy minutes before the data is actually there.
      test: ["CMD-SHELL", "pg_isready -h localhost -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Generous grace period: the first boot restores the whole dump before
      # the server starts accepting TCP connections.
      start_period: 600s

volumes:
  airlines-data:
  cli2ui-data:
