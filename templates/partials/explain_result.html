{% load i18n %}<div class="space-y-3">
  <div class="flex items-center gap-2 text-xs">
    <span class="text-strong font-medium">{% trans "Query plan" %}</span>
    {% if analyzed %}
      <span class="px-1.5 py-0.5 rounded bg-accent/50 text-accent border border-accent/60 text-[10px] uppercase tracking-wide">{% trans "analyze" %}</span>
    {% else %}
      <span class="px-1.5 py-0.5 rounded bg-raised text-body text-[10px] uppercase tracking-wide">{% trans "estimate" %}</span>
    {% endif %}
  </div>

  <pre class="bg-canvas border border-line rounded-lg p-4 text-xs mono text-strong overflow-x-auto whitespace-pre">{{ plan }}</pre>

  <form hx-post="{% url 'snapshot_save' connection.pk %}" hx-target="#explain-save" hx-swap="innerHTML"
        class="flex flex-wrap items-center gap-2">
    <input type="hidden" name="analyzed" value="{% if analyzed %}1{% else %}0{% endif %}">
    <textarea name="sql" class="hidden">{{ sql }}</textarea>
    <textarea name="plan_text" class="hidden">{{ plan }}</textarea>
    <textarea name="plan_json" class="hidden">{{ plan_json }}</textarea>
    <input name="label" placeholder="{% trans 'Snapshot name (e.g. before index)' %}" autocomplete="off"
           class="bg-canvas border border-line-strong rounded-lg px-3 py-1.5 text-sm text-heading
                  w-64 focus:outline-none focus:border-accent">
    <button type="submit"
            class="bg-accent hover:bg-accent text-on-accent font-medium rounded-lg px-4 py-1.5 text-sm">
      {% trans "Save snapshot" %}
    </button>
    <span id="explain-save" class="text-xs"></span>
  </form>
</div>
