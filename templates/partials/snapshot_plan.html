{% load i18n %}<div class="space-y-2">
  <p class="text-sm flex flex-wrap items-center gap-2">
    <span class="mono text-strong font-medium">{{ snapshot.label }}</span>
    {% if snapshot.analyzed %}
      <span class="px-1.5 py-0.5 rounded bg-accent/50 text-accent border border-accent/60 text-[10px] uppercase tracking-wide">{% trans "analyze" %}</span>
    {% endif %}
    <span class="text-muted">·</span>
    <span class="text-xs text-body mono truncate">{{ snapshot.sql }}</span>
  </p>
  <pre class="bg-canvas border border-line rounded-lg p-4 text-xs mono text-strong overflow-x-auto whitespace-pre">{{ snapshot.plan_text }}</pre>
</div>
