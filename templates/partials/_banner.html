{% comment %}Shared error / notice banner. error → danger; notice → warn if it
carries a "⚠" warning, otherwise info. Roles, not shades — see STYLE.md.{% endcomment %}
{% if error %}
  <div class="bg-danger/40 border border-danger rounded-lg px-4 py-2.5 text-sm text-danger/90 mono">{{ error }}</div>
{% endif %}
{% if notice %}
  <div class="{% if '⚠' in notice %}bg-warn/40 border-warn text-warn/90{% else %}bg-info/40 border-info text-info/90{% endif %} border rounded-lg px-4 py-2.5 text-sm">{{ notice }}</div>
{% endif %}
